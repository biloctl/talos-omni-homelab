apiVersion: external-secrets.io/v1
kind: SecretStore
metadata: { name: vault, namespace: demo-app }
spec:
  provider:
    vault:
      server: "http://vault.vault.svc:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "ghcr-pull"                       # -> policy ghcr-ro
