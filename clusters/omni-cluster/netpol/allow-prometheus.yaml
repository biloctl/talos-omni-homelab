# NOTE: inert on flannel (no NetworkPolicy enforcement). See default-deny.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: demo-app
spec:
  podSelector:
    matchLabels: { app: demo-app }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
      ports:
        - protocol: TCP
          port: 8080          # demo-app's /metrics port
