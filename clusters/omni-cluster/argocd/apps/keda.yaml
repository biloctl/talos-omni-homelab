apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: { name: keda, namespace: argocd }
spec:
  project: default
  source:
    repoURL: https://kedacore.github.io/charts     # public Helm repo (no cred)
    chart: keda
    targetRevision: 2.20.1
    helm:
      values: |
        resources:
          operator: { requests: { cpu: 100m, memory: 128Mi } }
  destination: { server: https://kubernetes.default.svc, namespace: keda }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true                        # large CRD (scaledjobs) overflows client-side apply
