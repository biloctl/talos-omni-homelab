alertmanager: { enabled: false }
grafana:
  enabled: true
  persistence: { enabled: false }   # dashboards from ConfigMaps; admin pw auto-gens into a Secret
kubeControllerManager: { enabled: false }   # Talos does not expose these to scraping
kubeScheduler:         { enabled: false }
kubeEtcd:              { enabled: false }
kubeProxy:             { enabled: false }
prometheus:
  prometheusSpec:
    retention: 7d
    retentionSize: 8GB
    resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { memory: 1536Mi } }
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: rook-ceph-block     # Ceph storage
          accessModes: ["ReadWriteOnce"]
          resources: { requests: { storage: 10Gi } }
    serviceMonitorSelectorNilUsesHelmValues: false   # scrape ANY ServiceMonitor
    podMonitorSelectorNilUsesHelmValues: false
